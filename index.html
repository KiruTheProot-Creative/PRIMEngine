<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRIMEngine Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* ---------- skins: dark = Unity 5 "Pro", light = Unity 4 gray ---------- */
:root, [data-skin="dark"] {
  --win:#262626; --panel:#383838; --panel-lo:#323232; --panel-hi:#454545; --bar:#4d4d4d; --bar-lo:#3e3e3e; --tab:#424242; --line:#1b1b1b; --line-hi:rgba(255,255,255,.12);
  --text:#c4c4c4; --text-hi:#f2f2f2; --muted:#8c8c8c; --field:#2a2a2a; --field-line:#141414; --sel:#2d5f93; --sel-text:#fff; --scene:#454a50; --grid:rgba(255,255,255,.045);
  --play:#475d7c; --folder:#8fa8c6; --filebg:#cfcfcf; --danger:#ff7b6b; --warn:#e0b04a; --accent:#7df3ff; color-scheme:dark;
}
[data-skin="light"] {
  --win:#9e9e9e; --panel:#c2c2c2; --panel-lo:#bbbbbb; --panel-hi:#d3d3d3; --bar:#dcdcdc; --bar-lo:#bcbcbc; --tab:#b4b4b4; --line:#7d7d7d; --line-hi:rgba(255,255,255,.7);
  --text:#1c1c1c; --text-hi:#000; --muted:#5d5d5d; --field:#f7f7f7; --field-line:#838383; --sel:#3d80df; --sel-text:#fff; --scene:#8e9196; --grid:rgba(0,0,0,.08);
  --play:#8eacdc; --folder:#5b83b6; --filebg:#f4f4f4; --danger:#b3261e; --warn:#8a6100; --accent:#1c6a76; color-scheme:light;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; background:var(--win); color:var(--text); font:12px/1.35 "Segoe UI","Lucida Grande",Tahoma,Verdana,system-ui,sans-serif; }
button, input, select { font:inherit; color:inherit; }
#root { height:100%; }
:focus-visible { outline:2px solid #6aa6ff; outline-offset:1px; }
[disabled] { opacity:.45; cursor:default !important; }
.sp { flex:1; }
.brand { font-weight:700; letter-spacing:.04em; font-size:26px; color:var(--text-hi); } .brand span { color:var(--accent); }
.motto { font:13px "Share Tech Mono",ui-monospace,monospace; color:var(--warn); letter-spacing:.1em; }

/* ---------- shared widgets ---------- */
.btn, .tbtn { appearance:none; border:1px solid var(--line); border-radius:3px; background:linear-gradient(var(--bar), var(--bar-lo)); box-shadow:inset 0 1px 0 var(--line-hi); color:var(--text-hi); padding:3px 11px; cursor:pointer; min-height:24px; white-space:nowrap; }
.btn:hover:not([disabled]), .tbtn:hover:not([disabled]) { background:linear-gradient(var(--panel-hi), var(--bar)); }
.btn.sm, .tbtn.sm { padding:1px 8px; min-height:20px; font-size:11px; } .btn.danger:hover { color:var(--danger); }
.hrow.dropt { outline:1px dashed #ffb53a; outline-offset:-1px; } .tbtn.on { background:var(--sel); color:var(--sel-text); border-color:#0e2338; box-shadow:inset 0 1px 3px rgba(0,0,0,.5); }
.txt, .num, .dd, .rename, .thead .tname { background:var(--field); border:1px solid var(--field-line); border-radius:3px; padding:2px 6px; min-height:22px; color:var(--text-hi); box-shadow:inset 0 1px 2px rgba(0,0,0,.3); min-width:0; }
.txt, .dd { width:100%; } .num { width:100%; text-align:right; font-family:"Share Tech Mono",ui-monospace,monospace; }
.dd.drop, .drop { outline:2px dashed var(--sel); outline-offset:-2px; }
.col { width:100%; height:22px; padding:1px; background:var(--field); border:1px solid var(--field-line); border-radius:3px; cursor:pointer; }
.chk { width:16px; height:16px; accent-color:var(--sel); margin:0; } input[type=range] { accent-color:var(--sel); width:100%; margin:0; }
.tri { background:none; border:0; width:14px; padding:0; text-align:center; cursor:pointer; color:var(--muted); flex:none; }
.tagpick { padding:6px; display:flex; flex-direction:column; gap:6px; max-height:420px; } .tagpick .tpq { width:100%; box-sizing:border-box; padding:6px 8px; background:var(--field, #15181d); color:inherit; border:1px solid var(--line); border-radius:3px; font:inherit; }
.tagpick .tpl { overflow-y:auto; display:flex; flex-direction:column; min-height:0; } .tagpick button { all:unset; box-sizing:border-box; display:flex; justify-content:space-between; gap:8px; width:100%; padding:4px 8px; cursor:pointer; border-radius:3px; }
.tagpick .tpg { font-weight:600; color:var(--text, #e6ecf4); } .tagpick .tpg.sub { padding-left:20px; font-weight:500; } .tagpick .tpi { padding-left:20px; } .tagpick .tpi.sub { padding-left:36px; } .tagpick button:hover, .tagpick button:focus-visible { background:var(--sel, #2c5d93); }
.tagpick .tpi.sel { outline:1px solid #ffb53a; } .tagpick .tpn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tagpick .tpk, .tagpick .tpc { color:var(--muted, #8b95a3); font:11px ui-monospace, monospace; white-space:nowrap; } .tagpick .tpe { padding:8px; color:var(--muted, #8b95a3); }
.tagbtn { text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.pop { position:fixed; z-index:200; min-width:190px; background:var(--panel-hi); border:1px solid var(--line); box-shadow:0 6px 18px rgba(0,0,0,.45); padding:3px 0; border-radius:0 0 3px 3px; }
.pitem { display:flex; justify-content:space-between; gap:24px; width:100%; background:none; border:0; text-align:left; padding:4px 14px; cursor:pointer; color:var(--text-hi); } .pitem:hover:not([disabled]) { background:var(--sel); color:var(--sel-text); } .pitem .k { color:var(--muted); } .pitem:hover .k { color:var(--sel-text); }
.sep { height:1px; background:var(--line); margin:3px 0; opacity:.6; }
#toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:300; background:var(--panel-hi); color:var(--text-hi); border:1px solid var(--line); padding:7px 14px; border-radius:3px; box-shadow:0 6px 18px rgba(0,0,0,.45); max-width:min(560px, 92vw); opacity:0; pointer-events:none; transition:opacity .2s; }
#toast.show { opacity:1; } #toast.error { border-color:var(--danger); }

/* ---------- project wizard ---------- */
.wiz { min-height:100%; display:grid; place-items:center; padding:24px var(--gut); }
.wwin { width:min(920px,100%); background:var(--panel); border:1px solid var(--line); box-shadow:0 12px 40px rgba(0,0,0,.5); border-radius:4px; overflow:hidden; }
.wtitle { text-align:center; padding:5px; font-weight:600; background:linear-gradient(var(--bar), var(--bar-lo)); border-bottom:1px solid var(--line); color:var(--text-hi); }
.wbar { display:flex; gap:8px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); background:var(--panel-lo); } .wbar .dd { width:auto; }
.wbody { padding:18px 20px 8px; } .brandrow { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
.wh { margin:20px 0 10px; font-weight:600; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; font-size:11px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(176px, 1fr)); gap:14px; }
.tile { position:relative; background:var(--panel-lo); border:1px solid var(--line); border-radius:3px; min-height:168px; padding:0; } .tile:hover { border-color:var(--sel); }
.tile-open { display:grid; gap:5px; width:100%; height:100%; text-align:left; background:none; border:0; padding:10px; cursor:pointer; align-content:start; }
.thumb { height:84px; display:grid; place-items:center; font:700 40px "Segoe UI",system-ui,sans-serif; color:var(--accent); background:linear-gradient(135deg, #2b3a4a, #141b22); border:1px solid var(--line); border-radius:2px; }
.tile .tname { font-weight:600; font-size:13px; color:var(--text-hi); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tdate { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tdel { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.55); border:1px solid var(--line); border-radius:3px; color:#ddd; padding:0 7px; min-height:22px; cursor:pointer; } .tdel:hover, .tdel.arm { background:#b3261e; color:#fff; }
.tile.plus { display:grid; place-items:center; align-content:center; gap:6px; border-style:dashed; cursor:pointer; color:var(--text); } .plus-sign { font:300 56px/1 "Segoe UI",system-ui,sans-serif; color:var(--accent); }
.wfoot { padding:10px 20px 14px; color:var(--muted); font-size:11px; }

/* ---------- editor layout ---------- */
body.in-editor { overflow:hidden; }
#app { --hw:240px; --iw:330px; --ph:270px; display:grid; height:100%; grid-template-columns:var(--hw) minmax(0,1fr) var(--iw); grid-template-rows:22px 34px minmax(0,1fr) var(--ph) 22px;
  grid-template-areas:"menu menu menu" "tool tool tool" "hier center insp" "proj proj insp" "status status status"; }
#menubar { grid-area:menu; } #toolbar { grid-area:tool; } #hier { grid-area:hier; } #center { grid-area:center; } #insp { grid-area:insp; } #proj { grid-area:proj; } #statusbar { grid-area:status; }
#menubar, #toolbar { display:flex; align-items:center; background:linear-gradient(var(--bar), var(--bar-lo)); border-bottom:1px solid var(--line); }
#menubar { padding:0 4px; } .mb { background:none; border:0; padding:2px 10px; cursor:pointer; color:var(--text-hi); height:21px; } .mb:hover, .mb.open { background:var(--sel); color:var(--sel-text); }
#toolbar { padding:0 8px; gap:10px; display:grid; grid-template-columns:1fr auto 1fr; } .tgroup { display:flex; gap:6px; align-items:center; min-width:0; } .tgroup.right { justify-content:flex-end; }
.tcenter { display:flex; gap:4px; } .tbtn.play { min-width:44px; font-size:13px; }
.projname { background:transparent; border:1px solid transparent; border-radius:3px; padding:2px 6px; min-width:0; width:170px; font-weight:600; color:var(--text-hi); } .projname:hover, .projname:focus { background:var(--field); border-color:var(--field-line); }
#app.playing #menubar, #app.playing #toolbar { background:linear-gradient(var(--play), var(--play)); }
.panel { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel); border:1px solid var(--line); }
.tabbar { display:flex; align-items:flex-end; gap:2px; height:25px; padding:3px 4px 0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; background:linear-gradient(var(--bar), var(--bar-lo)); border-bottom:1px solid var(--line); flex:none; } .tabbar > .tbtn, .tabbar > .txt, .tabbar > input { margin-bottom:2px; align-self:center; }
.tabbar::-webkit-scrollbar { display:none; } .tabbar > .tab { flex:none; white-space:nowrap; } .tabbar > .csize { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tab { background:var(--tab); border:1px solid var(--line); border-bottom:0; border-radius:3px 3px 0 0; padding:2px 12px; cursor:pointer; height:22px; color:var(--muted); } .tab.sel { background:var(--panel); color:var(--text-hi); height:23px; font-weight:600; }
.pbody { flex:1; overflow:auto; min-height:0; }
.split { position:absolute; z-index:6; } .split.h { top:0; bottom:0; right:-3px; width:6px; cursor:col-resize; } .split.i { top:0; bottom:0; left:-3px; width:6px; cursor:col-resize; } .split.p { left:0; right:0; top:-3px; height:6px; cursor:row-resize; } .split:hover { background:rgba(61,128,223,.5); }
#statusbar { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:0 10px; background:linear-gradient(var(--bar), var(--bar-lo)); border-top:1px solid var(--line); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #statusbar.err { color:var(--danger); } #statusbar.warn { color:var(--warn); } .fileinfo { color:var(--muted); margin-left:auto; padding-left:16px; flex:none; }

/* hierarchy */
.hrow { display:flex; align-items:center; gap:4px; padding:2px 6px 2px 4px; cursor:default; min-height:20px; } .hrow:hover { background:var(--panel-hi); } .hrow.sel { background:var(--sel); color:var(--sel-text); } .hrow.sel .tri, .hrow.sel .hmeta { color:var(--sel-text); }
.hic { width:16px; text-align:center; color:var(--muted); font-family:"Share Tech Mono",monospace; flex:none; } .hrow.sel .hic { color:var(--sel-text); } .hnm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hmeta { font-size:10px; color:var(--muted); flex:none; }

/* scene / game */
#center .pbody { display:flex; flex-direction:column; overflow:hidden; }
.cbar { display:flex; align-items:center; gap:10px; padding:3px 8px; border-bottom:1px solid var(--line); background:var(--panel-lo); flex:none; min-height:26px; flex-wrap:wrap; } .chip { background:var(--field); border:1px solid var(--field-line); border-radius:2px; padding:0 7px; font-weight:600; } .hint { color:var(--muted); font-size:11px; } .csize { margin-left:auto; align-self:center; color:var(--muted); font-size:11px; margin-bottom:2px; padding-right:6px; }
.hostwrap { position:relative; flex:1; min-height:0; background-color:var(--scene); background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:24px 24px; }
#center .host, #center .host.rt-host { position:absolute; inset:10px; width:auto; height:auto; background:transparent; } #center .rt-stage { box-shadow:0 0 0 1px #000, 0 6px 24px rgba(0,0,0,.5); }

/* inspector */
.insp { padding-bottom:30px; } .ihead { display:flex; gap:10px; align-items:center; padding:10px 10px 6px; } .bigic { width:34px; height:34px; display:grid; place-items:center; font:20px "Share Tech Mono",monospace; background:var(--field); border:1px solid var(--field-line); border-radius:3px; color:var(--accent); flex:none; }
.ititle { min-width:0; flex:1; } .idin { width:100%; background:transparent; border:1px solid transparent; border-radius:3px; padding:1px 4px; margin-left:-4px; font:600 15px "Segoe UI",system-ui,sans-serif; color:var(--text-hi); } .idin:hover:not(.ro), .idin:focus { background:var(--field); border-color:var(--field-line); } .idin.ro { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.isub { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; } .btnrow { display:flex; gap:5px; flex-wrap:wrap; padding:3px 10px 8px; }
.fold { border-top:1px solid var(--line); } .fh { display:flex; align-items:center; gap:4px; width:100%; background:linear-gradient(var(--bar), var(--bar-lo)); border:0; border-bottom:1px solid var(--line); box-shadow:inset 0 1px 0 var(--line-hi); padding:3px 8px; text-align:left; font-weight:600; cursor:pointer; color:var(--text-hi); } .fb { padding:5px 0 7px; }
.fld { display:grid; grid-template-columns:42% minmax(0,1fr); gap:6px; align-items:center; padding:2px 10px; min-height:24px; } .fld.compact { grid-template-columns:52% minmax(0,1fr); }
.flab { display:flex; flex-direction:column; min-width:0; overflow:hidden; } .flab.scrub { cursor:ew-resize; user-select:none; } .tn { font:10px "Share Tech Mono",ui-monospace,monospace; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .mono { font:11px "Share Tech Mono",ui-monospace,monospace; color:var(--accent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.numwrap { display:flex; flex-direction:column; gap:3px; } .selrow { display:flex; gap:4px; } .fctl.mm { display:flex; gap:4px; } .fpad { padding:6px 10px; } .thead { display:flex; gap:4px; padding:4px 10px 0; } .thead .tname { flex:1; font:11px "Share Tech Mono",monospace; }
.note { padding:6px 10px; font-size:11px; color:var(--muted); line-height:1.5; white-space:pre-line; } .note.warn { color:var(--warn); }
.preview { padding:8px 10px; display:grid; gap:8px; justify-items:start; } .preview img { max-width:100%; max-height:220px; image-rendering:pixelated; background:repeating-conic-gradient(#8884 0 25%, #0000 0 50%) 0 0/14px 14px; border:1px solid var(--line); } .fsample { color:var(--text-hi); word-break:break-word; }

/* project / explorer */
.search { width:150px !important; } .zoom { width:80px !important; align-self:center; margin:0 4px 2px; }
.explorer { display:grid; grid-template-columns:210px minmax(0,1fr); overflow:hidden !important; }
.ptree { overflow:auto; border-right:1px solid var(--line); background:var(--panel-lo); padding:3px 0; } .trow { display:flex; align-items:center; gap:3px; padding:1px 6px; cursor:default; min-height:20px; } .trow:hover { background:var(--panel-hi); } .trow.sel { background:var(--sel); color:var(--sel-text); } .trow.sel .tri { color:var(--sel-text); }
.pcontent { display:flex; flex-direction:column; min-width:0; min-height:0; } .pcontent.dropfiles { outline:2px dashed var(--sel); outline-offset:-3px; background:rgba(61,128,223,.12); }
.crumbs { display:flex; align-items:center; gap:2px; padding:2px 8px; border-bottom:1px solid var(--line); flex:none; background:var(--panel-lo); min-height:22px; } .crumb { background:none; border:0; cursor:pointer; padding:0 3px; color:var(--text-hi); } .crumb:hover { text-decoration:underline; } .sepc { color:var(--muted); }
.pgrid { flex:1; overflow:auto; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px; padding:8px; }
.pit { width:var(--cw); cursor:default; user-select:none; border-radius:3px; padding:2px; } .pit:hover { background:var(--panel-hi); } .pit.sel { background:rgba(61,128,223,.28); }
.pico { height:var(--ci); display:grid; place-items:center; } .ico { display:inline-block; } .ico svg { width:100%; height:100%; display:block; } .ico.big { width:var(--ci); height:var(--ci); } .ico.sm { width:16px; height:16px; flex:none; } .ico.bigico { width:34px; height:34px; flex:none; }
.thumbimg { max-width:var(--ci); max-height:var(--ci); image-rendering:pixelated; background:repeating-conic-gradient(#8884 0 25%, #0000 0 50%) 0 0/10px 10px; } .fontprev { display:grid !important; place-items:center; font-size:calc(var(--ci) * .5); color:var(--text-hi); background:var(--filebg); color:#222 !important; border:1px solid rgba(0,0,0,.4); }
.pit .pname { text-align:center; font-size:11px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-radius:2px; padding:0 2px; } .marq { position:fixed; z-index:9999; border:1px solid var(--sel); background:rgba(61,128,223,.22); pointer-events:none; }
.pit.sel .pname { background:var(--sel); color:var(--sel-text); } .rename { width:100%; font-size:11px; padding:0 2px; min-height:18px; }
.empty { color:var(--muted); padding:18px; max-width:46ch; line-height:1.5; }
.console { padding:2px 0; } .crow { display:flex; gap:10px; padding:2px 10px; border-bottom:1px solid var(--line); font-size:11px; } .crow.error { color:var(--danger); } .crow.warn { color:var(--warn); } .ct { color:var(--muted); font-family:"Share Tech Mono",monospace; flex:none; }

.play-layer, .play-layer.rt-host { position:fixed; inset:0; width:auto; height:auto; z-index:100; background:#000; }

/* ---------- narrow screens: stack the panels ---------- */
@media (max-width: 900px) {
  body.in-editor { overflow-y:auto; }
  #app { height:auto; min-height:100%; grid-template-columns:minmax(0,1fr); grid-template-rows:22px auto 62vw auto auto auto 22px; grid-template-areas:"menu" "tool" "center" "hier" "insp" "proj" "status"; }
  #center { min-height:300px; } #hier .pbody, #insp .pbody { max-height:340px; } #proj { height:300px; } .split { display:none; }
  #toolbar { grid-template-columns:1fr; height:auto; padding:4px 8px; } .tgroup.right { display:none; } .projname { width:130px; } .csize { display:none; } .explorer { grid-template-columns:130px minmax(0,1fr); }
}
@media (prefers-reduced-motion: reduce) { #toast { transition:none; } }

/* ---------- player / play ---------- */
.p3layer { position:absolute; inset:0; z-index:60; } .play-layer.p3layer { position:fixed; z-index:100; } .p3root { position:absolute; inset:0; background:#000; overflow:hidden; } .p3cv { cursor:none; }
.p3x { position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; } .p3hud { position:absolute; inset:0; pointer-events:none; }
.wehint { position:absolute; left:10px; bottom:8px; font:13px "Share Tech Mono",monospace; color:#7df3ff; text-shadow:0 1px 2px #000; pointer-events:none; }
.objtabs { display:flex; gap:4px; margin-bottom:6px; }
.p3leave { position:absolute; top:14px; right:14px; z-index:5; padding:8px 14px; background:#1b232d; color:#e6f0fa; border:1px solid #5a6b7d; border-radius:4px; font-size:14px; cursor:pointer; } .p3leave:hover { background:#2a3644; }
.p3msg { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; background:rgba(0,0,0,.45); color:#e6f0fa; font-size:15px; cursor:pointer; letter-spacing:.04em; }
/* ---------- maps ---------- */
#center .host.maphost { inset:0; background:var(--scene); }
