<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRIMEngine Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root { --ink:#030a12; --panel:#07131d; --panel2:#0b1b28; --line:#1d4a63; --line2:#123347; --cyan:#7df3ff; --cyan-deep:#2fb8d6; --amber:#ffb53a; --red:#ff6a5a; --text:#d9f7ff; --muted:#86aebf;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --mono:"Share Tech Mono",ui-monospace,"Courier New",monospace; --gut:max(16px, env(safe-area-inset-left, 0px)); color-scheme:dark; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; background:var(--ink); color:var(--text); font:14px var(--display); }
button, input, select { font:inherit; color:inherit; }
#root { height:100%; }
.brand { font-weight:700; letter-spacing:.06em; font-size:22px; white-space:nowrap; } .brand span { color:var(--cyan); } .brand.sm { font-size:17px; }

/* ---------- project manager ---------- */
.mgr { min-height:100%; padding:28px var(--gut) 60px; max-width:1100px; margin:0 auto; background:radial-gradient(900px 400px at 80% -10%, rgba(47,184,214,.12), transparent); }
.mgr header { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
.motto { font:15px var(--mono); color:var(--amber); letter-spacing:.12em; }
.mgr h1 { margin:34px 0 18px; font-size:clamp(34px,6vw,56px); letter-spacing:.03em; line-height:1; }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
.pcard { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:0; min-height:190px; }
.pcard-open { display:grid; gap:6px; width:100%; height:100%; text-align:left; background:none; border:0; padding:14px; cursor:pointer; align-content:start; border-radius:6px; }
.pcard:hover, .pcard.plus:hover { border-color:var(--cyan); }
.pthumb { height:96px; display:grid; place-items:center; font:700 44px var(--display); color:var(--cyan); background:linear-gradient(135deg,#0c2a3b,#06101a); border-radius:3px; border:1px solid var(--line2); }
.pname { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .pdate { font:12px var(--mono); color:var(--muted); }
.pdel { position:absolute; top:8px; right:8px; background:rgba(3,10,18,.8); border:1px solid var(--line); border-radius:3px; padding:2px 8px; cursor:pointer; min-height:28px; color:var(--muted); }
.pdel:hover, .pdel.arm { color:var(--ink); background:var(--red); border-color:var(--red); }
.pcard.plus { display:grid; place-items:center; align-content:center; gap:10px; border-style:dashed; cursor:pointer; background:transparent; color:var(--text); }
.plus-sign { font:300 64px/1 var(--display); color:var(--cyan); }
.mgr-note { margin-top:30px; color:var(--muted); max-width:60ch; line-height:1.5; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }

/* ---------- editor shell ---------- */
#app { display:grid; height:100%; grid-template-columns:270px minmax(0,1fr) 340px; grid-template-rows:48px minmax(0,1fr); grid-template-areas:"top top top" "left center right"; }
#top { grid-area:top; display:flex; align-items:center; gap:10px; padding:0 var(--gut); background:var(--panel); border-bottom:1px solid var(--line); min-width:0; }
#top .sp { flex:1; } #status { font:12px var(--mono); color:var(--muted); white-space:nowrap; } #status.dirty { color:var(--amber); }
.projname { background:transparent; border:1px solid transparent; border-radius:3px; padding:5px 8px; font-weight:600; min-width:0; width:200px; } .projname:hover, .projname:focus { border-color:var(--line); background:var(--ink); }
.tb { appearance:none; background:transparent; border:1px solid var(--line); border-radius:3px; padding:7px 12px; cursor:pointer; font-weight:600; letter-spacing:.04em; white-space:nowrap; min-height:34px; }
.tb:hover { border-color:var(--cyan); color:var(--cyan); } .tb.go { background:var(--cyan); color:var(--ink); border-color:var(--cyan); } .tb.go:hover { background:#bff9ff; color:var(--ink); } .tb.sm { min-height:30px; padding:4px 10px; }
#left, #right { background:var(--panel); overflow-y:auto; min-height:0; } #left { grid-area:left; border-right:1px solid var(--line); } #right { grid-area:right; border-left:1px solid var(--line); }
.sec-h { display:flex; align-items:center; justify-content:space-between; padding:14px var(--gut) 6px; font:600 11px var(--display); letter-spacing:.24em; color:var(--cyan-deep); text-transform:uppercase; }
.row-item { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0; border-left:3px solid transparent; padding:7px var(--gut); cursor:pointer; min-height:34px; }
.row-item:hover { background:var(--panel2); } .row-item.sel { background:var(--panel2); border-left-color:var(--cyan); color:var(--cyan); } .row-item.indent { padding-left:calc(var(--gut) + 14px); } .row-item.asset { cursor:default; }
.row-item .ic { width:18px; text-align:center; color:var(--cyan-deep); font-family:var(--mono); flex:none; } .row-item .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .row-item .meta { font:11px var(--mono); color:var(--muted); flex:none; }
.addrow, .btnrow { display:flex; flex-wrap:wrap; gap:6px; padding:4px var(--gut) 8px; }
.mini { appearance:none; background:transparent; border:1px solid var(--line); border-radius:3px; padding:4px 9px; cursor:pointer; font-size:12px; min-height:28px; letter-spacing:.02em; text-transform:none; }
.mini:hover:not(:disabled) { border-color:var(--cyan); color:var(--cyan); } .mini:disabled { opacity:.5; cursor:default; } .mini.danger:hover { border-color:var(--red); color:var(--red); }
.hint-sm, .note { padding:4px var(--gut); font-size:12px; color:var(--muted); line-height:1.45; } .note.warn { color:var(--amber); }

#center { grid-area:center; display:grid; grid-template-rows:auto minmax(0,1fr); min-width:0; min-height:0; background:#02070c; }
.ctools { display:flex; align-items:center; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line2); flex-wrap:wrap; } .csize { margin-left:auto; font:12px var(--mono); color:var(--muted); } .hint { font-size:12px; color:var(--muted); }
.seg { display:flex; } .segb { background:transparent; border:1px solid var(--line); padding:5px 14px; cursor:pointer; min-height:30px; } .segb:first-child { border-radius:3px 0 0 3px; } .segb:last-child { border-radius:0 3px 3px 0; border-left:0; } .segb.sel { background:var(--cyan); color:var(--ink); border-color:var(--cyan); font-weight:600; }
.hostwrap { position:relative; min-height:0; padding:14px; } .host { position:relative; width:100%; height:100%; border:1px solid var(--line); }

.tabs { display:flex; gap:4px; padding:8px var(--gut); border-bottom:1px solid var(--line2); position:sticky; top:0; background:var(--panel); z-index:2; }
.tab { flex:1; background:transparent; border:1px solid var(--line); border-radius:3px; padding:6px 10px; cursor:pointer; min-height:32px; } .tab.sel { background:var(--cyan); color:var(--ink); border-color:var(--cyan); font-weight:600; }
.insp { padding-bottom:50px; } .insp-title { padding:12px var(--gut) 2px; } .insp-sub { padding:0 var(--gut) 8px; font:12px var(--mono); color:var(--muted); }
.idin { width:100%; background:transparent; border:1px solid transparent; border-radius:3px; padding:4px 6px; margin-left:-6px; font:700 18px var(--display); } .idin:hover, .idin:focus { border-color:var(--line); background:var(--ink); }
.field { display:grid; gap:4px; padding:6px var(--gut); } .field.compact { padding:2px var(--gut) 6px; } .field > .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.field label { font-size:13px; } .field input[type=range] { width:100%; accent-color:var(--cyan); min-height:22px; } .field.mm { grid-template-columns:auto 1fr auto 1fr; align-items:center; }
.tagname { font:11px var(--mono); color:var(--cyan-deep); opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.num-in, .txt, .dd, .tname { background:var(--ink); border:1px solid var(--line); border-radius:3px; padding:5px 7px; min-height:32px; width:100%; } .num-in { width:90px; text-align:right; font:13px var(--mono); color:var(--cyan); }
.col { width:56px; height:32px; padding:2px; background:var(--ink); border:1px solid var(--line); border-radius:3px; cursor:pointer; }
.selrow { display:flex; gap:6px; } .chk { display:flex; align-items:center; gap:8px; min-height:32px; } .chk input { width:18px; height:18px; accent-color:var(--cyan); }
.group { border-top:1px solid var(--line2); padding-bottom:8px; } .trow { padding-bottom:4px; } .thead { display:flex; gap:6px; padding:6px var(--gut) 0; align-items:center; }
.tname { font:12px var(--mono); color:var(--text); } .tname.ro { background:none; border:0; padding:0; min-height:0; color:var(--cyan); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.play-layer, .play-layer.rt-host { position:fixed; inset:0; width:auto; height:auto; z-index:100; background:#000; }
@media (max-width:900px) {
  #app { height:auto; min-height:100%; grid-template-columns:minmax(0,1fr); grid-template-rows:48px 62vw auto auto; grid-template-areas:"top" "center" "left" "right"; }
  html, body { overflow-y:auto; } #center { min-height:300px; } #left, #right { overflow:visible; border:0; border-top:1px solid var(--line); } .projname { width:120px; } .brand.sm { display:none; } .csize { display:none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="src/core/tags.js"></script>
<script src="src/core/schema.js"></script>
<script src="src/core/store.js"></script>
<script src="src/core/runtime.js"></script>
<script src="src/studio/studio.js"></script>
</body>
</html>
