<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRIMEngine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root { --bg:#0a1117; --panel:#111c25; --panel2:#152330; --line:#22384a; --line2:#2d4a60; --text:#c9dde8; --dim:#7f98aa; --hi:#ffffff; --acc:#5fe3ff; --acc2:#ffb04a; --sel:#1d4a63; --danger:#ff7a6a; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px "Chakra Petch", system-ui, sans-serif; overflow:hidden; }
#pe { position:fixed; inset:0; }
button, input, select, textarea { font:inherit; color:inherit; }
.pe-btn { background:#173041; border:1px solid var(--line2); color:var(--text); border-radius:3px; padding:4px 11px; cursor:pointer; text-decoration:none; display:inline-block; white-space:nowrap; }
.pe-btn:hover { background:#1e3d52; color:var(--hi); } .pe-btn.on { background:var(--acc2); color:#1a0f00; border-color:var(--acc2); } .pe-btn.hi { background:#0f5a6e; border-color:var(--acc); color:#fff; } .pe-btn.play { background:#1b5a3a; border-color:#3fbf7a; color:#eaffef; }
.pe-btn.sm { padding:2px 8px; font-size:12px; } .pe-btn.danger { color:var(--danger); } .pe-btn:disabled { opacity:.4; cursor:default; }
.pe-sel, .pe-num, .pe-txt { background:#0b151c; border:1px solid var(--line2); border-radius:3px; padding:3px 6px; color:var(--text); min-width:0; }
.pe-num { width:86px; text-align:right; font-family:"Share Tech Mono",monospace; } .pe-txt { width:100%; } textarea.pe-txt { resize:vertical; font-family:inherit; }
.hint { color:var(--dim); font-size:12px; margin-left:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* ---- project list */
.pe-home { position:absolute; inset:0; overflow:auto; padding:48px 7vw; background:radial-gradient(ellipse at 70% -10%, #12384a, transparent 60%), var(--bg); }
.pe-logo b { display:block; font-size:44px; letter-spacing:.18em; color:var(--acc); font-weight:700; } .pe-logo span { color:var(--dim); letter-spacing:.06em; }
.pe-homebar { display:flex; gap:8px; margin:26px 0 18px; } .pe-plist { max-width:820px; }
.pe-prow { display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); background:var(--panel); margin-bottom:6px; border-radius:4px; }
.pe-pname { flex:1; font-size:16px; cursor:pointer; color:var(--hi); } .pe-pname:hover { color:var(--acc); } .pe-pdate { color:var(--dim); font-size:12px; }
.pe-empty { color:var(--dim); padding:14px; }
/* ---- editor layout */
.pe-app { position:absolute; inset:0; display:grid; grid-template-columns:250px 1fr 330px; grid-template-rows:40px 1fr 150px 22px; grid-template-areas:"top top top" "left center right" "left bottom right" "status status status"; }
.pe-top { grid-area:top; display:flex; align-items:center; gap:6px; padding:0 10px; background:#0d171e; border-bottom:1px solid var(--line); }
.pe-top .sp { flex:1; } .pe-brand { font-weight:700; letter-spacing:.16em; color:var(--acc); cursor:pointer; margin-right:8px; } .pe-pn { background:transparent; border:1px solid transparent; color:var(--hi); padding:3px 6px; width:220px; } .pe-pn:hover, .pe-pn:focus { border-color:var(--line2); }
.pe-left { grid-area:left; background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding-bottom:20px; }
.pe-head { display:flex; align-items:center; justify-content:space-between; padding:9px 10px 5px; color:var(--acc); letter-spacing:.14em; font-size:11px; } .pe-head.sub { padding-top:14px; }
.pe-row { display:flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer; white-space:nowrap; } .pe-row:hover { background:#18303f; } .pe-row.on { background:var(--sel); color:var(--hi); } .pe-row.in { padding-left:24px; } .pe-row.dim { color:var(--dim); } .pe-row.cur .lb { font-weight:700; color:var(--hi); }
.pe-row .ic { width:14px; text-align:center; color:var(--acc); flex:none; } .pe-row .lb { flex:1; overflow:hidden; text-overflow:ellipsis; } .pe-row .sub { color:var(--dim); font-size:11px; }
.pe-center { grid-area:center; display:flex; flex-direction:column; min-width:0; min-height:0; background:#081016; }
.pe-ctabs { display:flex; gap:2px; padding:4px 6px 0; background:#0d171e; } .pe-tab { background:transparent; border:1px solid transparent; border-bottom:none; color:var(--dim); padding:4px 14px; cursor:pointer; border-radius:3px 3px 0 0; } .pe-tab.on { background:#13212b; color:var(--hi); border-color:var(--line); }
.pe-cbar { display:flex; align-items:center; gap:5px; padding:5px 8px; background:#13212b; border-bottom:1px solid var(--line); overflow:hidden; } .pe-lab { color:var(--dim); margin-left:6px; }
.pe-host { position:relative; flex:1; min-height:0; }
.pe-right { grid-area:right; background:var(--panel); border-left:1px solid var(--line); overflow:auto; }
.pe-insp { padding:8px 10px 30px; } .pe-ihead { display:flex; gap:10px; align-items:center; margin:4px 0 10px; } .pe-ihead .big { font-size:24px; color:var(--acc); width:28px; text-align:center; } .pe-ihead .t { font-size:16px; color:var(--hi); } .pe-ihead .s { color:var(--dim); font-size:12px; }
.pe-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.pe-fold { border-top:1px solid var(--line); margin-top:4px; } .pe-fh { padding:7px 0; cursor:pointer; color:var(--acc); letter-spacing:.06em; font-weight:600; } .pe-fb { padding-bottom:6px; }
.pe-fld { display:grid; grid-template-columns:1fr 150px; gap:8px; align-items:center; padding:2px 0; } .pe-fld label { color:var(--text); font-size:12px; line-height:1.25; } .pe-ctl { display:flex; justify-content:flex-end; min-width:0; } .pe-ctl > * { max-width:100%; }
.pe-ctl .pe-sel, .pe-ctl .pe-txt { width:100%; } .pe-numw { display:flex; gap:6px; align-items:center; } .pe-numw input[type=range] { width:60px; } .pe-ctl input[type=color] { width:56px; height:22px; border:1px solid var(--line2); background:none; padding:0; }
.pe-face { border:1px solid var(--line); border-radius:3px; padding:4px 6px; margin-bottom:5px; } .pe-face.on { border-color:var(--acc2); } .pe-fn { color:var(--dim); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
.pe-note { color:var(--dim); font-size:12px; line-height:1.45; margin:8px 0; }
.pe-bottom { grid-area:bottom; background:var(--panel); border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.pe-shelfbar { display:flex; align-items:center; gap:8px; padding:5px 10px; } .pe-headl { color:var(--acc); letter-spacing:.14em; font-size:11px; }
.pe-shelf { flex:1; overflow:auto; display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; padding:4px 10px 10px; } .pe-shelf.drop { outline:2px dashed var(--acc); outline-offset:-4px; }
.pe-asset { position:relative; width:78px; text-align:center; cursor:grab; } .pe-asset img, .pe-aic { width:64px; height:64px; object-fit:cover; border:1px solid var(--line2); border-radius:3px; background:#0b151c; image-rendering:pixelated; }
.pe-aic { display:grid; place-items:center; margin:0 auto; font-size:24px; color:var(--acc); } .pe-an { font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pe-x { position:absolute; top:-4px; right:2px; background:#2a1414; border:1px solid #5a2a2a; color:#ffb4a8; border-radius:50%; width:18px; height:18px; line-height:14px; padding:0; cursor:pointer; display:none; } .pe-asset:hover .pe-x { display:block; }
.pe-status { grid-area:status; padding:3px 10px; background:#0d171e; border-top:1px solid var(--line); color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; } .pe-status.warn { color:var(--acc2); }
.pe-menu { position:fixed; z-index:1000; background:#13212b; border:1px solid var(--line2); border-radius:3px; padding:3px 0; min-width:160px; box-shadow:0 6px 20px #000a; } .pe-mi { padding:5px 12px; cursor:pointer; } .pe-mi:hover { background:var(--sel); }
.pe-play { position:fixed; inset:0; z-index:500; background:#000; }
.v3err { position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); }
</style>
</head>
<body>
<div id="pe"></div>
<script src="src/core/tags.js"></script>
<script src="src/core/zip.js"></script>
<script src="src/core/host.js"></script>
<script src="src/core/math3d.js"></script>
<script src="src/core/fbx.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/render3d.js"></script>
<script src="src/core/hud.js"></script>
<script src="src/core/animlib.js"></script>
<script src="src/pe/defs.js"></script>
<script src="src/pe/store.js"></script>
<script src="src/pe/world.js"></script>
<script src="src/pe/shapes.js"></script>
<script src="src/pe/game.js"></script>
<script src="src/pe/builder.js"></script>
<script src="src/studio/hudeditor.js"></script>
<script src="src/pe/app.js"></script>
</body>
</html>
