name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check shaders compile
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          $entries = @(@("VS_Block","vs_5_0"), @("PS_Opaque","ps_5_0"), @("PS_Cutout","ps_5_0"), @("PS_Ghost","ps_5_0"), @("VS_Sky","vs_5_0"), @("PS_Sky","ps_5_0"))
          foreach ($e in $entries) {
            & $fxc.FullName /nologo /T $e[1] /E $e[0] /Fo NUL shaders/block.hlsl
            if ($LASTEXITCODE -ne 0) { throw "Shader $($e[0]) failed" }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/PRIMEngine.exe out/
          Copy-Item -Recurse shaders out/shaders
          Copy-Item README.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: PRIMEngine-windows
          path: out
