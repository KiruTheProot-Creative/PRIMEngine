name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload game build
        uses: actions/upload-artifact@v4
        with:
          name: PRIMEngine-windows
          path: |
            build/Release/prime_d3d11.exe
            build/Release/shaders/
