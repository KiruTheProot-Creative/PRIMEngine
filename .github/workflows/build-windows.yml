name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check shaders compile
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          $entries = @(@("VS_Block","vs_5_0"), @("PS_Opaque","ps_5_0"), @("PS_Cutout","ps_5_0"), @("PS_Ghost","ps_5_0"), @("VS_Shadow","vs_5_0"), @("PS_ShadowCutout","ps_5_0"), @("PS_Post","ps_5_0"), @("PS_Volume","ps_5_0"), @("PS_Reflect","ps_5_0"), @("PS_Water","ps_5_0"), @("PS_BloomDown","ps_5_0"), @("PS_BloomUp","ps_5_0"), @("VS_SkyMap","vs_5_0"), @("VS_Rain","vs_5_0"), @("VS_Dust","vs_5_0"), @("PS_Rain","ps_5_0"), @("PS_Bolt","ps_5_0"), @("VS_Sky","vs_5_0"), @("PS_Sky","ps_5_0"))
          foreach ($e in $entries) {
            & $fxc.FullName /nologo /T $e[1] /E $e[0] /Fo NUL shaders/block.hlsl
            if ($LASTEXITCODE -ne 0) { throw "Shader $($e[0]) failed" }
          }

      - name: Take screenshots
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build/Release/PRIMEngine.exe -ArgumentList "--screenshots shots" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); "TIMEOUT after 10 minutes" | Out-File -Append shots/log.txt }
          Get-Content shots/log.txt
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

      - name: Publish screenshots to the "screenshots" branch
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force pub | Out-Null
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, [long]92)
          Get-ChildItem shots -Filter *.png | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName); $img.Save((Join-Path $PWD "pub/$($_.BaseName).jpg"), $codec, $ep); $img.Dispose() }
          if (Test-Path shots/log.txt) { Copy-Item shots/log.txt pub/ }
          "${{ github.sha }}" | Out-File pub/commit.txt
          cd pub
          git init -q; git checkout -q -b screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A; git commit -qm "Screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/PRIMEngine.exe out/
          Copy-Item -Recurse shaders out/shaders
          Copy-Item README.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: PRIMEngine-windows
          path: out
