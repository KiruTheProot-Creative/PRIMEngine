name: Build desktop app

# Builds PRIMEngine Studio for Windows, macOS and Linux on GitHub's servers.
# Download the results from the "Actions" tab (open a run, scroll to "Artifacts"),
# or from the "Releases" page when a version tag (v0.1.0, v0.2.0 ...) is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
        working-directory: desktop
      - name: Build
        run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PRIMEngine-Studio-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

  # Collects the three builds and publishes them on the Releases page.
  # Every push to main updates the release called "Latest build"; a version tag (v0.2.0 ...) makes its own release.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: PRIMEngine-Studio-*
          merge-multiple: true
          path: dist
      - name: Move the "latest" tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: "Unsigned builds of PRIMEngine Studio. Windows only for now: download the .exe (portable, no install). Mac and Linux builds come once the Windows app is finished."
          files: dist/*
